title: Web Request Matching Phishing Kit Paths Seen on .kz Infrastructure
id: 0b9d2c4e-8a1f-4e6b-b0a3-5d7e9c1f2a34
status: experimental
description: |
  Detects HTTP requests to URL paths that correlate with phishing kits found in Week 3
  (clusters C01, C03, C06): Apple/iCloud kit "/m/sing/" on *.com.kz lookalikes, and
  Brazilian banking/webmail kits "/acessomob/loginautentica.php" and
  "/acessodes/login/logininicial.php" hosted on jcloud.kz.
references:
  - https://github.com/Phishing-Database/Phishing.Database
author: Galimzhan Zhandos
date: 2026-09-27
tags:
  - attack.initial-access
  - attack.t1566.002
logsource:
  category: proxy
detection:
  selection_apple_kit:
    c-uri|contains: '/m/sing/'
    cs-host|endswith: '.com.kz'
  selection_br_kit:
    c-uri|contains:
      - '/acessomob/loginautentica.php'
      - '/acessodes/login/logininicial.php'
  condition: 1 of selection_*
falsepositives:
  - Unknown
level: high
